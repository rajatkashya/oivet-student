<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OIVET Admin</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f4f6f9;margin:0;color:#222}.wrap{max-width:1100px;margin:auto;padding:16px}.card{background:#fff;border-radius:12px;padding:18px;margin:14px 0;box-shadow:0 4px 18px #0001}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}label{font-weight:600;font-size:14px}input,button{font:inherit;padding:10px;border-radius:7px;border:1px solid #ccd2da}input[type=text],input[type=password],input[type=url],input[type=date],input[type=tel]{width:100%;margin-top:5px}input[type=file]{width:100%;margin-top:5px}button{cursor:pointer;background:#fff}.primary{background:#1769e0;color:#fff;border:0}.danger{background:#c62828;color:#fff;border:0}.muted{color:#667085;font-size:13px}.msg{margin-left:8px}.preview{width:150px;height:85px;object-fit:contain;border:1px dashed #ccd2da;background:#fafafa;border-radius:8px;display:block;margin-top:8px}.logo-preview{height:90px}.stamp-preview{height:120px}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;border-top:1px solid #eee;padding:12px 0}.student-left{display:flex;gap:12px;align-items:center;min-width:0}.thumb{width:55px;height:55px;object-fit:cover;border-radius:6px;background:#eee}.actions{white-space:nowrap}.search{margin-bottom:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.row{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions button{width:48%}.top{align-items:flex-start}.preview{width:100%}}
</style></head><body><div class="wrap">
<div id="login" class="card"><h2>Admin Login</h2><input id="pw" type="password" placeholder="Admin password"><button class="primary" onclick="login()">Login</button><span id="msg" class="msg"></span><p class="muted">Admin password is stored as a Cloudflare Worker Secret, not in this page.</p></div>
<div id="app" hidden>
<div class="card"><div class="top"><div><h2 style="margin:0">OIVET Admin Panel</h2><p class="muted">Website settings and student verification records</p></div><button onclick="logout()">Logout</button></div></div>
<div class="card"><h3>Website Settings</h3><div class="grid">
<label>Website title<input id="title" type="text" placeholder="Student Verification"></label>
<div></div>
<label>Main/Header Logo<input id="headerLogoFile" type="file" accept="image/*"><img id="headerLogoPreview" class="preview logo-preview"></label>
<label>Top Banner<input id="topBannerFile" type="file" accept="image/*"><img id="topBannerPreview" class="preview"></label>
<label>Verification Stamp<input id="verificationStampFile" type="file" accept="image/*"><img id="verificationStampPreview" class="preview stamp-preview"></label>
<label>Footer Logo<input id="footerLogoFile" type="file" accept="image/*"><img id="footerLogoPreview" class="preview logo-preview"></label>
<label>Facebook<input id="facebook" type="url" placeholder="https://facebook.com/..."></label>
<label>Twitter/X<input id="twitter" type="url" placeholder="https://x.com/..."></label>
<label>Instagram<input id="instagram" type="url" placeholder="https://instagram.com/..."></label>
<label>LinkedIn<input id="linkedin" type="url" placeholder="https://linkedin.com/company/..."></label>
<label>WhatsApp number<input id="whatsapp" type="tel" placeholder="+91 9876543210"></label>
</div><button class="primary" onclick="saveSettings()">Save Website Settings</button><span id="settingsMsg" class="msg"></span><p class="muted">Images are resized in the browser before saving. Keep each image reasonably sized.</p></div>
<div class="card"><h3>Student Records</h3><div class="grid"><label>Registration No.<input id="regno"></label><label>DOB<input id="dob" type="date"></label><label>Name<input id="name"></label><label>Father<input id="father"></label><label>Mother<input id="mother"></label><label>Course<input id="course"></label><label>Course Code<input id="courseCode"></label><label>Period<input id="period"></label><label>Duration<input id="duration"></label><label>Marks<input id="marks"></label><label>Grade<input id="grade"></label><label>Centre<input id="center"></label><label class="full">Student photo<input id="photo" type="file" accept="image/*"><small class="muted">Existing photo stays if no new photo is selected while editing.</small><img id="studentPreview" class="preview" style="width:90px;height:110px"></label></div><button class="primary" onclick="saveStudent()">Save Student</button><button onclick="clearForm()">Clear</button><span id="saveMsg" class="msg"></span></div>
<div class="card"><div class="top"><h3 style="margin:0">Students</h3><input id="search" class="search" type="text" placeholder="Search registration no., name, course..." oninput="render()" style="max-width:420px"></div><div id="list">Loading...</div></div>
</div></div><script>
let editing=null,currentPhoto='',students=[];const $=id=>document.getElementById(id);
async function api(url,opt){let r=await fetch(url,opt);let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}
async function login(){try{await api('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:$('pw').value})});await show();}catch(e){$('msg').textContent=e.message}}
async function show(){try{let m=await api('/api/admin/me');if(m.authenticated){$('login').hidden=true;$('app').hidden=false;await loadSettings();await loadStudents()}else{$('login').hidden=false;$('app').hidden=true}}catch(e){$('msg').textContent=e.message}}
async function logout(){await api('/api/admin/logout',{method:'POST'});location.reload()}
function clearForm(){editing=null;currentPhoto='';$('regno').disabled=false;['regno','dob','name','father','mother','course','courseCode','period','duration','marks','grade','center'].forEach(id=>$(id).value='');$('photo').value='';$('studentPreview').removeAttribute('src');$('saveMsg').textContent=''}
function fill(s){editing=s.regno;$('regno').disabled=true;$('regno').value=s.regno;$('dob').value=s.dob||'';$('name').value=s.name||'';$('father').value=s.father||'';$('mother').value=s.mother||'';$('course').value=s.course||'';$('courseCode').value=s.courseCode||'';$('period').value=s.period||'';$('duration').value=s.duration||'';$('marks').value=s.marks||'';$('grade').value=s.grade||'';$('center').value=s.center||'';currentPhoto=s.photo||'';if(currentPhoto)$('studentPreview').src=currentPhoto;scrollTo({top:0,behavior:'smooth'})}
function resizeFile(file,maxW,maxH,quality){return new Promise((resolve,reject)=>{if(!file)return resolve('');let img=new Image();let url=URL.createObjectURL(file);img.onload=()=>{let sc=Math.min(1,maxW/img.width,maxH/img.height);let c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',quality))};img.onerror=reject;img.src=url})}
function previewFile(input,preview,maxW,maxH,quality){input.addEventListener('change',async()=>{let f=input.files[0];if(!f)return;try{let d=await resizeFile(f,maxW,maxH,quality);$(preview).src=d}catch(e){}})}
previewFile($('headerLogoFile'),'headerLogoPreview',700,250,.78);previewFile($('topBannerFile'),'topBannerPreview',1400,500,.76);previewFile($('verificationStampFile'),'verificationStampPreview',900,900,.78);previewFile($('footerLogoFile'),'footerLogoPreview',700,300,.78);previewFile($('photo'),'studentPreview',700,900,.78);
async function fileData(input,maxW,maxH,quality){let f=input.files[0];return f?await resizeFile(f,maxW,maxH,quality):''}
async function loadSettings(){let d=await api('/api/settings');let s=d.settings||{};$('title').value=s.title||'';let im={};let so={};try{im=JSON.parse(s.images_json||'{}')}catch(e){}try{so=JSON.parse(s.social_json||'{}')}catch(e){}$('facebook').value=so.facebook||'';$('twitter').value=so.twitter||'';$('instagram').value=so.instagram||'';$('linkedin').value=so.linkedin||'';$('whatsapp').value=so.whatsapp||'';if(im.headerLogo)$('headerLogoPreview').src=im.headerLogo;if(im.topBanner)$('topBannerPreview').src=im.topBanner;if(im.verificationStamp)$('verificationStampPreview').src=im.verificationStamp;if(im.footerLogo)$('footerLogoPreview').src=im.footerLogo}
async function saveSettings(){try{let d=await api('/api/settings');let old=d.settings||{};let im={};try{im=JSON.parse(old.images_json||'{}')}catch(e){}let a=await fileData($('headerLogoFile'),700,250,.78);if(a)im.headerLogo=a;a=await fileData($('topBannerFile'),1400,500,.76);if(a)im.topBanner=a;a=await fileData($('verificationStampFile'),900,900,.78);if(a)im.verificationStamp=a;a=await fileData($('footerLogoFile'),700,300,.78);if(a)im.footerLogo=a;let so={facebook:$('facebook').value.trim(),twitter:$('twitter').value.trim(),instagram:$('instagram').value.trim(),linkedin:$('linkedin').value.trim(),whatsapp:$('whatsapp').value.trim()};await api('/api/settings',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({title:$('title').value.trim(),images_json:JSON.stringify(im),social_json:JSON.stringify(so)})});$('settingsMsg').textContent='Website settings saved';}catch(e){$('settingsMsg').textContent=e.message}}
async function saveStudent(){try{let photo=await fileData($('photo'),700,900,.78);if(!photo)photo=currentPhoto;let s={regno:$('regno').value,dob:$('dob').value,name:$('name').value,father:$('father').value,mother:$('mother').value,course:$('course').value,courseCode:$('courseCode').value,period:$('period').value,duration:$('duration').value,marks:$('marks').value,grade:$('grade').value,center:$('center').value,photo};let url=editing?'/api/students/'+encodeURIComponent(editing):'/api/students';await api(url,{method:editing?'PUT':'POST',headers:{'content-type':'application/json'},body:JSON.stringify(s)});$('saveMsg').textContent='Saved';clearForm();await loadStudents()}catch(e){$('saveMsg').textContent=e.message}}
async function loadStudents(){try{let d=await api('/api/students');students=d.students||[];render()}catch(e){$('list').textContent=e.message}}
function render(){let q=($('search').value||'').trim().toLowerCase();let arr=students.filter(s=>!q||[s.regno,s.name,s.father,s.course,s.center,s.dob].join(' ').toLowerCase().includes(q));$('list').innerHTML=arr.length?arr.map(s=>`<div class="row"><div class="student-left">${s.photo?`<img class="thumb" src="${esc(s.photo)}">`:''}<div><b>${esc(s.regno)}</b><br>${esc(s.name||'')}<br><span class="muted">${esc(s.course||'')} · ${esc(s.dob||'')}</span></div></div><div class="actions"><button onclick='fill(${JSON.stringify(s)})'>Edit</button><button class="danger" onclick='delStudent(${JSON.stringify(s.regno)})'>Delete</button></div></div>`).join(''):'No matching students.'}
async function delStudent(r){if(!confirm('Delete '+r+'?'))return;try{await api('/api/students/'+encodeURIComponent(r),{method:'DELETE'});await loadStudents()}catch(e){alert(e.message)}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
show();$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
</script></body></html>
